[project]
name = "mcp-huaweicloud-rfs"
version = "0.1.0"
description = "MCP Server for Huawei Cloud RFS (Resource Formation Service)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.0",
    "huaweicloud-mcp-core>=1.0,<2",
    "huaweicloudsdkcore>=3.1",
    "huaweicloudsdkrfs>=3.1",
]

[project.scripts]
mcp-huaweicloud-rfs = "mcp_server_rfs.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_rfs"]

[tool.uv]
# Force pyasn1 >= 0.6.4 to fix 3 DoS CVEs (CVE-2026-59884/59885/59886).
# huaweicloudsdkcore<=3.1.218 pins pyasn1<=0.6.3 in its own requires_dist; override
# until the SDK ships a relaxed constraint.
override-dependencies = ["pyasn1>=0.6.4"]

[tool.uv.sources]
huaweicloud-mcp-core = { path = "../../libs/huaweicloud_mcp_core" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

# huaweicloudsdk* ships without type stubs; treat as untyped per spec §11.2.
[[tool.mypy.overrides]]
module = ["huaweicloudsdkcore.*", "huaweicloudsdkrfs.*"]
ignore_missing_imports = true
