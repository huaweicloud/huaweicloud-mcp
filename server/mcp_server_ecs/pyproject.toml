[project]
name = "mcp-server-ecs"
version = "0.1.0"
description = "MCP Server for Huawei Cloud ecs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.0",
    "huaweicloud-mcp-core>=1.0,<2",
    "mcp-server-ecs-common>=0.1,<1",
    "huaweicloudsdkcore>=3.1",
    "huaweicloudsdkecs>=3.1",
]

[project.scripts]
mcp-server-ecs = "mcp_server_ecs.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Force pyasn1 >= 0.6.4 to fix 3 DoS CVEs (CVE-2026-59884/59885/59886);
# huaweicloudsdkcore pins pyasn1<=0.6.3 until it ships a relaxed constraint.
override-dependencies = ["pyasn1>=0.6.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_ecs"]

[tool.uv.sources]
huaweicloud-mcp-core = { path = "../../libs/huaweicloud_mcp_core" }
mcp-server-ecs-common = { path = "../../libs/mcp_server_ecs_common" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["huaweicloudsdkcore.*", "huaweicloudsdkecs.*"]
ignore_missing_imports = true
