[project]
name = "huaweicloud-mcp-ecs-common"
version = "0.1.0"
description = "Shared utilities for Huawei Cloud ECS MCP servers (ecs & ecs-lifecycle)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huaweicloud_mcp_ecs_common"]

# testsupport.py is test-only (env-cleaning + fake-server builder); keep it out
# of the installed wheel so it does not ship as a runtime import.
[tool.hatch.build.targets.wheel.force-exclude]
"src/huaweicloud_mcp_ecs_common/testsupport.py" = "huaweicloud_mcp_ecs_common/testsupport.py"

[tool.hatch.build.targets.wheel.force-include]
"src/huaweicloud_mcp_ecs_common/py.typed" = "huaweicloud_mcp_ecs_common/py.typed"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
