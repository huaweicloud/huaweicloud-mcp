version: '2.0'

env:
  resource:
    type: docker
    image: kweecr05.his.huawei.com:80/ecr-build-green202/cbu_cloudbuild_240617:1.0.12
    class: 8U16G

params:
  - name: product
    value: cloudbuild2.0
  - name: CB_AUTO_CHECK_VERSION
    value: 2.0
  - name: BC_NEXT3RD_VERSION
    value: 2.0.0

steps:
  PRE_BUILD:
    - checkout:
        depth: 0
        path: .
    - hwcloud_artifact:
        action: download
  BUILD:
    - build_execute:
        command: |- ## 构建没有什么必要毕竟不需要发布
          cd ${WORKSPACE}
          sh .cloudbuild/build.sh
        check:
          auto: true
          mode: sync
          dangerouscmd:
            command: set proxy,git clone,bin/scp,bin/curl,bin/wget,bin/ssh,bin/mount,bin/rsync
  POST_BUILD:
    - sh:
        command: |
          pip install importlib-metadata==7.1.0 -i https://cmc.centralrepo.rnd.huawei.com/artifactory/pypi-central-repo/simple/ --trusted-host cmc.centralrepo.rnd.huawei.com
    - hwcloud_artifact:
        version: '1.0'
        python_deploy:
          - whl_path: dist/huaweicloud_mcp_core-*.whl
