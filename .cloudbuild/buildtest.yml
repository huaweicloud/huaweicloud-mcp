version: 2.0
env:
  resource:
    type: docker
    image: kweecr05.his.huawei.com:80/ecr-build-green202/cbu_cloudbuild_240617:1.0.12
    class: 8U16G
params:
  - name: CID_credible_repo
    value: true
  - name: CB_AUTO_CHECK_VERSION
    value: 2.0
  - name: BC_NEXT3RD_VERSION
    value: 2.0.0

steps:
  PRE_BUILD:
    - checkout:
        depth: 0
        path: .
  BUILD:
    - build_execute:
        command: |-
          cd ${WORKSPACE}
          # Install test dependencies (pytest, pytest-cov, etc.)
          pip3 install -r requirements.txt
          # Run tests with coverage collection
          # run_tests.py will:
          #   1. Install local packages (core + services) in dependency order
          #   2. Run pytest with --cov for all source directories
          #   3. Generate coverage.xml, htmlcov/, and report.json
          python3 tests/run_tests.py
        check:
          skip_compile: true
  POST_BUILD:
    - sh:
        command: |-
          echo "Uploading coverage reports to CodeCov..."
          echo "ENV_SERVICE_NAME: ${ENV_SERVICE_NAME}"
          cd ${WORKSPACE}
          ls -la
          # Download and execute codecov upload script
          curl -k "https://dev.codecov.rnd.huawei.com/rest/codecov/freeExecShell/getShContent/2109459061626896385" -o codecov.sh
          bash -x ./codecov.sh
