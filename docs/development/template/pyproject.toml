[project]
name = "mcp-server-huaweicloud-PLACEHOLDER"
version = "0.1.0"
description = "MCP Server for Huawei Cloud PLACEHOLDER"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.0",
    "huaweicloud-mcp-core>=1.0,<2",
    "huaweicloudsdkcore>=3.1",
    "huaweicloudsdkPLACEHOLDER>=3.1",
]

[project.scripts]
mcp-server-huaweicloud-PLACEHOLDER = "mcp_server_PLACEHOLDER.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_PLACEHOLDER"]

[tool.uv.sources]
huaweicloud-mcp-core = { path = "../../libs/huaweicloud_mcp_core" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
